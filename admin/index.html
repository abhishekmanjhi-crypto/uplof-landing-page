<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Kept out of Google and out of sitemap.xml. The sitemap generator reads this
     exact tag, so nothing about /admin/ is hardcoded there. -->
<meta name="robots" content="noindex, nofollow">
<title>Uplof CMS</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
<!-- Sveltia CMS. Open source, and a drop-in replacement for Decap, so the config
     is portable if this project ever goes away. -->
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

<script>
/**
 * Make the preview pane render the actual article page, not a generic markdown
 * dump in the CMS's own dark theme.
 *
 * Two things are needed for that, and the first attempt got both wrong:
 *
 *   registerPreviewStyle(css, raw) takes a BOOLEAN second argument. Passing
 *   `{ raw: true }` throws a TypeError, which aborted this whole script, which
 *   is why none of the styles applied at all the first time.
 *
 *   registerPreviewTemplate(name, fn) needs a FUNCTION returning elements built
 *   with window.createElement — the bundle exposes it for exactly this. It does
 *   work, despite older docs saying it is unimplemented.
 *
 * Everything below is wrapped so that a mistake degrades to the default preview
 * rather than breaking the editor. A CMS that will not load is much worse than
 * a preview that looks plain.
 */
(() => {
  const SHEETS = ['tokens', 'base', 'components', 'blocks', 'legal', 'insight'];

  // Mirrors the real article template closely enough to judge the page by:
  // brand masthead, the short-answer block, then the body in .prose.
  const SHELL = `
    /* Each block constrains ITSELF rather than relying on a wrapper class.
       The previous version put the width and padding on a .pv-wrap parent and
       read --pv-pad from it; in the real preview frame that produced a
       full-width red masthead with the eyebrow hard against the left edge, so
       something between the CMS's own container and this rule was winning.
       Self-contained blocks cannot be defeated that way, and box-sizing keeps
       the padding inside the max-width instead of adding to it. */
    html, body { background: var(--bg-page); margin: 0; }
    .pv-masthead, .pv-body { box-sizing: border-box; max-inline-size: 760px; margin-inline: auto; }

    .pv-masthead {
      background: var(--red-500);
      padding: 40px 40px 34px;
      margin-block-end: 40px;
    }
    .pv-eyebrow {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--cream-100); opacity: 0.8; margin: 0 0 16px;
    }
    .pv-title {
      font-family: var(--font-display); font-weight: 500;
      font-size: 1.875rem; line-height: 1.14; letter-spacing: -0.02em;
      color: var(--cream-100);
      margin: 0 0 18px; padding-block-end: 0.28em;   /* descender room */
    }
    .pv-meta {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--cream-100); opacity: 0.75; margin: 0;
    }

    .pv-body { padding: 0 40px 80px; }
    .pv-body img { max-inline-size: 100%; block-size: auto; }
    .pv-body > .insight__answer { margin-block-end: 36px; }

    /* Tighter than the live page, because the pane is narrower than a viewport */
    .pv-body h2 { font-size: 1.375rem; margin-block: 32px 10px; }
    .pv-body h3 { font-size: 1.0625rem; margin-block: 24px 8px; }
    .pv-body p, .pv-body li { font-size: 0.9375rem; line-height: 1.6; }

    .pv-empty { color: var(--ink-500); font-style: italic; }
  `;

  const register = () => {
    const CMS = window.CMS;
    if (!CMS?.registerPreviewStyle) return false;

    try {
      for (const name of SHEETS) CMS.registerPreviewStyle(`/css/${name}.css`);
      CMS.registerPreviewStyle(SHELL, true);   // boolean, not an object
    } catch (err) {
      console.warn('preview styles failed:', err);
    }

    try {
      const h = window.createElement;
      if (!h || !CMS.registerPreviewTemplate) return true;

      CMS.registerPreviewTemplate('blog', (props) => {
        try {
          const data = props.entry?.get ? props.entry.get('data') : props.entry?.data;
          const get = (k) => (data?.get ? data.get(k) : data?.[k]) ?? '';

          const date = get('publishDate');
          const pretty = date
            ? new Date(date).toLocaleDateString('en-GB',
                { day: 'numeric', month: 'long', year: 'numeric' })
            : '';
          const cluster = String(get('cluster') || '').replace(/-/g, ' ');
          const answer = get('quickAnswer');

          return h('div', null,
            h('header', { className: 'pv-masthead on-brand' },
              cluster ? h('p', { className: 'pv-eyebrow' }, cluster) : null,
              h('h1', { className: 'pv-title' }, get('title') || 'Untitled'),
              h('p', { className: 'pv-meta' },
                [get('author'), pretty].filter(Boolean).join(' · ')),
            ),
            h('div', { className: 'pv-body prose' },
              answer
                ? h('div', { className: 'insight__answer' },
                    h('p', { className: 'insight__answer-label' }, 'Short answer'),
                    h('p', null, answer))
                : h('p', { className: 'pv-empty' }, 'No short answer yet.'),
              props.widgetFor ? props.widgetFor('body') : null,
            ),
          );
        } catch (err) {
          // Never let a render error take the editor down with it.
          console.warn('preview template failed, falling back:', err);
          return h('div', { style: 'padding:24px' },
            props.widgetFor ? props.widgetFor('body') : 'Preview unavailable');
        }
      });
    } catch (err) {
      console.warn('preview template could not be registered:', err);
    }
    return true;
  };

  // The bundle is a module, so window.CMS may not exist yet when this runs.
  if (!register()) {
    let tries = 0;
    const timer = setInterval(() => {
      if (register() || ++tries > 150) clearInterval(timer);
    }, 100);
  }
})();
</script>
</body>
</html>
