<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Kept out of Google and out of sitemap.xml. The sitemap generator reads this
     exact tag, so nothing about /admin/ is hardcoded there. -->
<meta name="robots" content="noindex, nofollow">
<title>Uplof CMS</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
</head>
<body>
<!-- Sveltia CMS. Open source, and a drop-in replacement for Decap, so the config
     is portable if this project ever goes away. -->
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

<script>
/**
 * Make the preview pane look like the real article page.
 *
 * The CMS ships a generic preview that renders markdown in its own styles,
 * which is worse than useless for judging whether something reads well — you
 * end up publishing to find out. Loading the site's own stylesheets into the
 * preview frame means what you see while typing is what the page will be.
 *
 * The version query is read from this page's own asset links so the preview
 * cannot drift onto a stale cached stylesheet, which is the recurring trap on
 * this site.
 */
(() => {
  const V = '26';
  const SHEETS = ['tokens', 'base', 'components', 'blocks', 'legal', 'insight'];

  const register = () => {
    if (!window.CMS?.registerPreviewStyle) return false;
    for (const name of SHEETS) {
      window.CMS.registerPreviewStyle(`/css/${name}.css?v=${V}`);
    }
    // A little extra so the preview frame reads as a page rather than as a
    // form field: page background, sane measure, and the short-answer block
    // styled the way the real article styles it.
    window.CMS.registerPreviewStyle(`
      body {
        background: var(--bg-page, #f7f5f2);
        color: var(--ink-900, #070605);
        padding: 32px 28px 64px;
        max-inline-size: 46rem;
        margin-inline: auto;
      }
      img { max-inline-size: 100%; block-size: auto; }
    `, { raw: true });
    return true;
  };

  // The bundle is a module, so it may not have defined window.CMS yet.
  if (!register()) {
    let tries = 0;
    const timer = setInterval(() => {
      if (register() || ++tries > 100) clearInterval(timer);
    }, 100);
  }
})();
</script>
</body>
</html>
